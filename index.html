<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Michael Jemmy Tanzel — Portfolio</title>
  <meta name="description" content="Portfolio of Michael Jemmy Tanzel, a Computer Science student at BINUS University focused on frontend, UI/UX, and database engineering.">
  <meta name="theme-color" content="#2D3BFF">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="hero" id="top">
    <div class="wrap">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <ul class="chips" id="chips"></ul>
    </div>
  </header>

  <main class="wrap">
    <section id="about">
      <div class="sec-head"><h2>About me</h2></div>
      <div class="about-grid">
        <img class="portrait" id="portrait" width="320" height="400">
        <p class="about" id="about-text"></p>
      </div>
    </section>

    <section id="skills">
      <div class="sec-head"><h2>Skills</h2></div>
      <dl class="skills" id="skills-list"></dl>
    </section>

    <section id="projects">
      <div class="sec-head"><h2>Projects</h2></div>
      <h3 class="sub">Websites</h3>
      <div class="site-grid" id="website-list"></div>
      <h3 class="sub">Other projects</h3>
      <div id="project-list"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="cta">
        <h2 id="cta-heading"></h2>
        <p id="cta-text"></p>
        <a class="chip primary" id="cta-mail"></a>
      </div>

      <div class="foot-grid">
        <div>
          <p class="brand" id="foot-brand"></p>
          <p class="tagline" id="foot-tagline"></p>
        </div>
        <nav aria-label="Footer navigation">
          <h3>Navigation</h3>
          <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
          </ul>
        </nav>
        <div>
          <h3>Contact</h3>
          <ul id="foot-contact"></ul>
        </div>
        <div>
          <h3>Social</h3>
          <ul id="foot-links"></ul>
        </div>
      </div>

      <div class="foot-bottom">
        <p id="copy"></p>
        <a href="#top">Back to top</a>
      </div>
    </div>
  </footer>

</body>
</html>
